<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background - sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3CB371;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="128" height="128" rx="16" ry="16" fill="url(#skyGradient)"/>

  <!-- Sun -->
  <circle cx="38" cy="28" r="18" fill="url(#sunGradient)"/>

  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="14" y1="28" x2="20" y2="28"/>
    <line x1="56" y1="28" x2="62" y2="28"/>
    <line x1="21" y1="11" x2="25" y2="15"/>
    <line x1="51" y1="41" x2="55" y2="45"/>
    <line x1="55" y1="11" x2="51" y2="15"/>
    <line x1="25" y1="41" x2="21" y2="45"/>
  </g>

  <!-- Back mountain (right, taller) -->
  <polygon points="45,128 90,35 135,128" fill="url(#mountainGradient1)"/>

  <!-- Front mountain (left) -->
  <polygon points="-7,128 48,58 103,128" fill="url(#mountainGradient2)"/>
</svg>
